name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve metadata
    runs-on: ubuntu-24.04
    outputs:
      grok_version: ${{ steps.metadata.outputs.grok_version }}
      omg_version: ${{ steps.metadata.outputs.omg_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      upstream_commit: ${{ steps.metadata.outputs.upstream_commit }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t lock_lines < upstream.lock
          if [[ ${#lock_lines[@]} -ne 2 ]]; then
            echo "upstream.lock must contain exactly commit and version lines" >&2
            exit 1
          fi

          read -r commit_key upstream_commit commit_extra <<< "${lock_lines[0]}"
          read -r version_key grok_version version_extra <<< "${lock_lines[1]}"
          if [[ $commit_key != commit || -n ${commit_extra:-} ]] ||
            [[ ! $upstream_commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid commit entry in upstream.lock" >&2
            exit 1
          fi
          if [[ $version_key != version || -z $grok_version || -n ${version_extra:-} ]]; then
            echo "invalid version entry in upstream.lock" >&2
            exit 1
          fi

          cargo_version=$(cargo metadata --locked --format-version 1 --no-deps |
            jq -er '[.packages[] | select(.name == "xai-grok-version") | .version]
              | if length == 1 then .[0] else error("missing package") end')
          changelog_version=$(awk '$1 == "#" && $2 ~ /^[0-9]+\.[0-9]+\.[0-9]+/ {
            print $2
            exit
          }' crates/codegen/xai-grok-shell/CHANGELOG.md)
          if ! [[ $grok_version == "$cargo_version" && $grok_version == "$changelog_version" ]]; then
            echo "upstream version mismatch: lock=$grok_version cargo=$cargo_version changelog=$changelog_version" >&2
            exit 1
          fi

          source_sha=$(git rev-parse HEAD)
          if [[ $source_sha != "$GITHUB_SHA" ]]; then
            echo "checked-out commit does not match GITHUB_SHA" >&2
            exit 1
          fi

          commit_epoch=$(git show -s --format=%ct HEAD)
          commit_date=$(date -u -d "@$commit_epoch" +%Y%m%d)
          omg_version="0.${commit_date}.${GITHUB_RUN_NUMBER}"
          release_tag="v${omg_version}"

          existing_tag=$(git ls-remote --tags origin "refs/tags/${release_tag}")
          if [[ -n $existing_tag ]]; then
            echo "release tag already exists: $release_tag" >&2
            exit 1
          fi

          {
            echo "grok_version=$grok_version"
            echo "omg_version=$omg_version"
            echo "release_tag=$release_tag"
            echo "source_sha=$source_sha"
            echo "upstream_commit=$upstream_commit"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS Intel
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            runner: macos-26
            target: aarch64-apple-darwin

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-cpu=generic -C force-unwind-tables=yes"
      GROK_VERSION: ${{ needs.metadata.outputs.grok_version }}
      OMG_VERSION: ${{ needs.metadata.outputs.omg_version }}
      RELEASE_ASSET: omg-${{ needs.metadata.outputs.release_tag }}-${{ matrix.target }}.tar.gz
      TARGET: ${{ matrix.target }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}

      - name: Install build tools
        run: cargo install dotslash --locked --version 0.5.7

      - name: Build
        run: |
          cargo build --locked \
            --package xai-grok-pager-bin \
            --bin omg \
            --target "$TARGET" \
            --release \
            --features release-dist

      - name: Strip and smoke test
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/omg"
          strip "$binary"
          "$binary" --version | tee /dev/stderr | grep -F \
            "omg ${OMG_VERSION} (grok ${GROK_VERSION},"
          "$binary" --help > /dev/null

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/package"
          mkdir -p "$package_dir"
          install -m 0755 "target/${TARGET}/release/omg" "$package_dir/omg"
          install -m 0644 LICENSE THIRD-PARTY-NOTICES "$package_dir/"
          tar -C "$package_dir" -czf "dist/${RELEASE_ASSET}" \
            omg LICENSE THIRD-PARTY-NOTICES

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ env.RELEASE_ASSET }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      GROK_VERSION: ${{ needs.metadata.outputs.grok_version }}
      OMG_VERSION: ${{ needs.metadata.outputs.omg_version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
      UPSTREAM_COMMIT: ${{ needs.metadata.outputs.upstream_commit }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate and verify checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(omg-*.tar.gz)
          if [[ ${#assets[@]} -ne 4 ]]; then
            echo "expected 4 release assets, found ${#assets[@]}" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/omg-*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Oh My Grok ${OMG_VERSION}" \
            --notes "Based on Grok ${GROK_VERSION} at upstream ${UPSTREAM_COMMIT}. OMG source: ${SOURCE_SHA}." \
            --latest
